async function loadCollection(key, fallback) {
  try {
    const raw = localStorage.getItem("dw_" + key);
    if (raw) return JSON.parse(raw);
    throw new Error("empty");
  } catch (e) {
    try {
      localStorage.setItem("dw_" + key, JSON.stringify(fallback));
    } catch (e2) {
      /* ignore */
    }
    return fallback;
  }
}
async function saveCollection(key, value) {
  try {
    localStorage.setItem("dw_" + key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

function HeroOrb() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let reduce = false;
    try {
      reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}
    if (reduce) return;
    function handleMove(e) {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      el.style.setProperty("--rx", (-y * 10).toFixed(2) + "deg");
      el.style.setProperty("--ry", (x * 10).toFixed(2) + "deg");
    }
    function handleLeave() {
      el.style.setProperty("--rx", "0deg");
      el.style.setProperty("--ry", "0deg");
    }
    window.addEventListener("mousemove", handleMove);
    el.addEventListener("mouseleave", handleLeave);
    return () => {
      window.removeEventListener("mousemove", handleMove);
      el.removeEventListener("mouseleave", handleLeave);
    };
  }, []);

  return (
    <div className="dw-orb-wrap">
      <div className="dw-orb" ref={ref}>
        <div className="dw-orb-spin">
          <img src={IMAGES.logo_full} alt="Draween.shop" className="dw-orb-img" />
        </div>
      </div>
    </div>
  );
}

/* ============ ADMIN ============ */

const emptyForm = { id: "", name: "", category: CATEGORIES[0], price: "", description: "", image: "", badge: "", comingSoon: false };

function AdminPanel({ products, setProducts, reviews, setReviews, onClose, notify }) {
  const [form, setForm] = useState(emptyForm);
  const [editingId, setEditingId] = useState(null);
  const [reviewForm, setReviewForm] = useState({ name: "", text: "", rating: 5 });
  const fileRef = useRef(null);

  function startEdit(p) {
    setEditingId(p.id);
    setForm({ ...p, price: String(p.price) });
  }
  function startNew() {
    setEditingId("new");
    setForm(emptyForm);
  }
  function cancelForm() {
    setEditingId(null);
    setForm(emptyForm);
  }

  async function handleImageFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setForm((f) => ({ ...f, image: reader.result }));
    };
    reader.readAsDataURL(file);
  }

  async function saveProduct() {
    if (!form.name.trim() || (!form.comingSoon && !form.price)) {
      notify("Заполните название и цену");
      return;
    }
    const priceNum = form.price ? Number(form.price) : 0;
    let next;
    if (editingId === "new") {
      next = [...products, { ...form, id: uid(), price: priceNum }];
    } else {
      next = products.map((p) => (p.id === editingId ? { ...form, id: editingId, price: priceNum } : p));
    }
    setProducts(next);
    const ok = await saveCollection("products", next);
    notify(ok ? "Товар сохранён" : "Сохранено локально (ошибка синхронизации)");
    cancelForm();
  }

  async function deleteProduct(id) {
    const next = products.filter((p) => p.id !== id);
    setProducts(next);
    const ok = await saveCollection("products", next);
    notify(ok ? "Товар удалён" : "Удалено локально (ошибка синхронизации)");
  }

  async function addReview() {
    if (!reviewForm.name.trim() || !reviewForm.text.trim()) {
      notify("Заполните имя и текст отзыва");
      return;
    }
    const next = [...reviews, { id: uid(), ...reviewForm, rating: Number(reviewForm.rating) }];
    setReviews(next);
    await saveCollection("reviews", next);
    setReviewForm({ name: "", text: "", rating: 5 });
    notify("Отзыв добавлен");
  }

  async function deleteReview(id) {
    const next = reviews.filter((r) => r.id !== id);
    setReviews(next);
    await saveCollection("reviews", next);
    notify("Отзыв удалён");
  }

  return (
    <div className="dw-overlay" onClick={onClose}>
      <div className="dw-modal wide" onClick={(e) => e.stopPropagation()}>
        <div className="dw-modal-head">
          <strong>Админ-панель</strong>
          <button type="button" className="dw-modal-close" onClick={onClose} aria-label="Закрыть">✕</button>
        </div>

        {editingId ? (
          <div>
            <div className="dw-field">
              <label>Фото товара</label>
              {form.image ? <img src={form.image} className="dw-image-preview" alt="" /> : null}
              <input ref={fileRef} type="file" accept="image/*" onChange={handleImageFile} />
            </div>
            <div className="dw-field">
              <label>Название</label>
              <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            </div>
            <div className="dw-field">
              <label>Категория</label>
              <select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="dw-field dw-checkbox-field">
              <label className="dw-checkbox-label">
                <input
                  type="checkbox"
                  checked={!!form.comingSoon}
                  onChange={(e) => setForm({ ...form, comingSoon: e.target.checked })}
                />
                Скоро будет (товар ещё нельзя купить, показывается во вкладке «Скоро будет»)
              </label>
            </div>
            <div className="dw-field">
              <label>Цена, ₸ {form.comingSoon ? "(необязательно, пока товара нет в продаже)" : ""}</label>
              <input type="number" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} />
            </div>
            <div className="dw-field">
              <label>Бейдж (необязательно, напр. «Хит»)</label>
              <input value={form.badge} onChange={(e) => setForm({ ...form, badge: e.target.value })} />
            </div>
            <div className="dw-field">
              <label>Описание</label>
              <textarea value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button type="button" className="dw-btn primary" onClick={saveProduct}>Сохранить</button>
              <button type="button" className="dw-btn ghost" onClick={cancelForm}>Отмена</button>
            </div>
          </div>
        ) : (
          <>
            <button type="button" className="dw-btn primary block" onClick={startNew} style={{ marginBottom: 14 }}>
              + Добавить товар
            </button>
            <div className="dw-admin-list">
              {products.map((p) => (
                <div className="dw-admin-row" key={p.id}>
                  <img src={p.image} alt="" />
                  <div className="dw-admin-row-info">
                    <div className="dw-admin-row-name">{p.name}</div>
                    <div className="dw-admin-row-meta">
                      {p.category} · {p.comingSoon ? "скоро будет" : formatPrice(p.price)}
                    </div>
                  </div>
                  <div className="dw-admin-row-actions">
                    <button type="button" className="dw-icon-btn" onClick={() => startEdit(p)} aria-label="Изменить">✎</button>
                    <button type="button" className="dw-icon-btn danger" onClick={() => deleteProduct(p.id)} aria-label="Удалить">🗑</button>
                  </div>
                </div>
              ))}
              {products.length === 0 ? <p style={{ color: "var(--muted)", fontSize: 13 }}>Товаров пока нет.</p> : null}
            </div>

            <hr style={{ margin: "22px 0", border: "none", borderTop: "1.5px solid var(--line)" }} />

            <strong style={{ fontSize: 14 }}>Отзывы</strong>
            <div className="dw-admin-list" style={{ marginTop: 10 }}>
              {reviews.map((r) => (
                <div className="dw-admin-row" key={r.id}>
                  <div className="dw-admin-row-info">
                    <div className="dw-admin-row-name">{r.name} · {"★".repeat(r.rating)}</div>
                    <div className="dw-admin-row-meta">{r.text}</div>
                  </div>
                  <div className="dw-admin-row-actions">
                    <button type="button" className="dw-icon-btn danger" onClick={() => deleteReview(r.id)} aria-label="Удалить">🗑</button>
                  </div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 14 }}>
              <div className="dw-field">
                <label>Имя</label>
                <input value={reviewForm.name} onChange={(e) => setReviewForm({ ...reviewForm, name: e.target.value })} />
              </div>
              <div className="dw-field">
                <label>Текст отзыва</label>
                <textarea value={reviewForm.text} onChange={(e) => setReviewForm({ ...reviewForm, text: e.target.value })} />
              </div>
              <div className="dw-field">
                <label>Оценка</label>
                <select value={reviewForm.rating} onChange={(e) => setReviewForm({ ...reviewForm, rating: e.target.value })}>
                  {[5, 4, 3, 2, 1].map((n) => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <button type="button" className="dw-btn ghost" onClick={addReview}>+ Добавить отзыв</button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function AdminGate({ onClose, onSuccess }) {
  const [code, setCode] = useState("");
  const [error, setError] = useState("");
  function submit() {
    if (code.trim() === ADMIN_CODE) {
      setError("");
      onSuccess();
    } else {
      setError("Неверный код");
    }
  }
  function handleKeyDown(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  }
  return (
    <div className="dw-overlay" onClick={onClose}>
      <div className="dw-modal" onClick={(e) => e.stopPropagation()}>
        <div className="dw-modal-head">
          <strong>Вход в админ-панель</strong>
          <button type="button" className="dw-modal-close" onClick={onClose} aria-label="Закрыть">✕</button>
        </div>
        <div className="dw-field">
          <label>Код доступа</label>
          <input
            type="password"
            value={code}
            onChange={(e) => setCode(e.target.value)}
            onKeyDown={handleKeyDown}
            autoFocus
          />
        </div>
        {error ? <p style={{ color: "var(--danger)", fontSize: 13, marginBottom: 10 }}>{error}</p> : null}
        <button type="button" className="dw-btn primary block" onClick={submit}>Войти</button>
      </div>
    </div>
  );
}

/* ============ APP ============ */

function App() {
  const [products, setProducts] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [loading, setLoading] = useState(true);
  const [activeTab, setActiveTab] = useState("home");
  const [setBuilder, setSetBuilder] = useState([]);
  const [gateOpen, setGateOpen] = useState(false);
  const [adminOpen, setAdminOpen] = useState(false);
  const [toast, setToast] = useState("");

  useEffect(() => {
    let mounted = true;
    (async () => {
      const [p, r] = await Promise.all([
        loadCollection("products", DEFAULT_PRODUCTS),
        loadCollection("reviews", DEFAULT_REVIEWS),
      ]);
      if (!mounted) return;
      setProducts(p);
      setReviews(r);
      setLoading(false);
    })();
    return () => { mounted = false; };
  }, []);

  function notify(msg) {
    setToast(msg);
    window.clearTimeout(notify._t);
    notify._t = window.setTimeout(() => setToast(""), 2600);
  }

  function toggleSet(id) {
    setSetBuilder((cur) => (cur.includes(id) ? cur.filter((x) => x !== id) : [...cur, id]));
  }

  function goTab(id) {
    setActiveTab(id);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  let page;
  if (activeTab === "home") page = <HomePage products={products} goTab={goTab} setBuilder={setBuilder} toggleSet={toggleSet} />;
  else if (activeTab === "catalog") page = <CatalogPage products={products} setBuilder={setBuilder} toggleSet={toggleSet} />;
  else if (activeTab === "soon") page = <SoonPage products={products} />;
  else if (activeTab === "set") page = <SetBuilderPage products={products} setBuilder={setBuilder} toggleSet={toggleSet} />;
  else if (activeTab === "reviews") page = <ReviewsPage reviews={reviews} />;
  else if (activeTab === "about") page = <AboutPage />;
  else if (activeTab === "favorites") page = <FavoritesPage />;
  else if (activeTab === "contacts") page = <ContactsPage />;

  return (
    <div className="dw-root">
      <style>{SITE_CSS}</style>

      <nav className="dw-nav">
        <div className="dw-nav-inner">
          <button className="dw-logo" onClick={() => goTab("home")} type="button">
            <LogoIcon size={38} />
            <span className="dw-logo-text dw-display">DRAWEEN.SHOP</span>
          </button>
          <div className="dw-tabs">
            {TABS.map((t) => (
              <button
                key={t.id}
                type="button"
                className={"dw-tab-btn " + (activeTab === t.id ? "active" : "")}
                onClick={() => goTab(t.id)}
              >
                {t.label}
                {t.id === "set" && setBuilder.length > 0 ? <span className="dw-set-count">{setBuilder.length}</span> : null}
              </button>
            ))}
          </div>
        </div>
      </nav>

      {loading ? (
        <div className="dw-loading">
          <div className="dw-spinner" />
          Загружаем каталог…
        </div>
      ) : (
        page
      )}

      <footer className="dw-footer">
        <div className="dw-container dw-footer-inner">
          <div className="dw-footer-socials">
            <a href={whatsappLink("Здравствуйте!")} target="_blank" rel="noopener noreferrer">WhatsApp</a>
            <a href={telegramLink()} target="_blank" rel="noopener noreferrer">Telegram</a>
            <a href={tiktokLink()} target="_blank" rel="noopener noreferrer">TikTok</a>
          </div>
          <button type="button" className="dw-footer-admin" onClick={() => setGateOpen(true)}>
            панель управления
          </button>
        </div>
      </footer>

      {gateOpen && !adminOpen ? (
        <AdminGate
          onClose={() => setGateOpen(false)}
          onSuccess={() => { setGateOpen(false); setAdminOpen(true); }}
        />
      ) : null}

      {adminOpen ? (
        <AdminPanel
          products={products}
          setProducts={setProducts}
          reviews={reviews}
          setReviews={setReviews}
          onClose={() => setAdminOpen(false)}
          notify={notify}
        />
      ) : null}

      <Toast message={toast} />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
